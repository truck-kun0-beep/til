<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <div class="display">
      <div id="previous" class="previous"></div>
      <div id="current" class="current">0</div>
    </div>

    <div id="buttons" class="buttons">
      <button data-action="clear" class="span-2 function">AC</button>
      <button data-action="delete" class="function">DEL</button>
      <button data-operator="/" class="operator">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button data-operator="*" class="operator">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button data-operator="-" class="operator">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button data-operator="+" class="operator">+</button>

      <button data-number="0" class="span-2">0</button>
      <button data-action="decimal">.</button>
      <button data-action="equals" class="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
