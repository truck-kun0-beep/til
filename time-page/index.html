<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Current Time</title>
  <style>
    body {
      font-family: sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: #fff;
    }
    #time { font-size: 3rem; }
    #date { opacity: 0.7; }
  </style>
</head>
<body>
  <div>
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <!-- load dayjs from node_modules -->
  <script src="node_modules/dayjs/dayjs.min.js"></script>
  <script>
    function updateTime() {
      const now = dayjs();
      document.getElementById("time").textContent = now.format("hh:mm:ss A");
      document.getElementById("date").textContent = now.format("dddd, MMMM D, YYYY");
    }

    updateTime();                 // show immediately
    setInterval(updateTime, 1000); // then refresh every second
  </script>
</body>
</html>
